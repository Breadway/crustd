name: dev release

# Publishes a dev-track build on every push to main (the trunk branch).
# See bread-ecosystem's docs/release-channels.md for the track policy.
#
# crustd has no git.breadway.dev dependencies, so unlike the sibling
# dev-release workflows there is no dev-deps.sh step: the build is a plain
# locked build of main. There is no ci/build.sh wrapper yet either.
on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch main --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: build
        run: |
          set -euo pipefail
          cd src && cargo build --release --locked || {
            echo "::error::cargo build --release --locked failed. If Cargo.lock drifted, update and commit it; do not drop --locked."
            exit 1
          }

      - name: compute dev version
        run: |
          set -euo pipefail
          cd src
          # Base the dev version on the latest published stable tag, not
          # Cargo.toml, so a dev build always sorts newer than the release
          # it follows.
          LATEST_TAG="$(git ls-remote --tags --refs \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" 'v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | (grep -v -- '-' || true) | sort -V | tail -1)"
          if [ -n "${LATEST_TAG}" ]; then
            CUR="${LATEST_TAG}"
          else
            CUR="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          IFS='.' read -r MA MI PA <<< "${CUR}"
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=${MA}.${MI}.$((PA + 1))-dev.${TS}+${SHA}" >> "$GITHUB_ENV"

      - name: prepare artifacts
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/crustd/${VERSION}"
          mkdir -p "${PKG_DIR}"
          cp src/target/release/crustd "${PKG_DIR}/crustd-x86_64"
          strip "${PKG_DIR}/crustd-x86_64"
          sha256sum "${PKG_DIR}/crustd-x86_64" | awk '{print $1}' \
            > "${PKG_DIR}/crustd-x86_64.sha256"
          cp src/packaging/systemd/crustd.service "${PKG_DIR}/"
          cp src/crustd.example.toml "${PKG_DIR}/"
          cp src/LICENSE "${PKG_DIR}/"
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          ln -sfn "${VERSION}" "/srv/breadway-dl/dev/crustd/latest"

      - name: regenerate dev index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set; refusing to regenerate the dev index unsigned"
            exit 1
          fi
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-crustd-dev-XXXXXX)"
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          TRACK=dev bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"
          rm -rf "${ECOSYSTEM_CI_DIR}"
